<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>今天吃什么 · 转盘</title>
<style>
  :root {
    --bg: #1a1a2e;
    --accent: #ff5e57;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 20%, #2b2b4a 0%, #1a1a2e 60%, #12121f 100%);
    color: #fff;
    padding: 24px 12px;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  h1 {
    font-size: 28px;
    letter-spacing: 2px;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  h1 .emoji { display: inline-block; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

  .wheel-wrap {
    position: relative;
    width: min(88vw, 420px);
    aspect-ratio: 1 / 1;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
  }

  /* 顶部指针 */
  .pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 34px solid #ffd54f;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    z-index: 3;
  }
  .pointer::after {
    content: "";
    position: absolute;
    top: -34px; left: -7px;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 3px #ffd54f;
  }

  /* 中心按钮 */
  .spin-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 76px; height: 76px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    color: #7a3b00;
    background: radial-gradient(circle at 35% 30%, #ffe08a, #ffb300 70%);
    box-shadow: 0 4px 0 #c98a00, 0 8px 20px rgba(0,0,0,0.4);
    z-index: 4;
    transition: transform 0.1s ease;
  }
  .spin-btn:active { transform: translate(-50%, -50%) scale(0.94); }
  .spin-btn:disabled { cursor: not-allowed; opacity: 0.85; }

  .result {
    min-height: 56px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    padding: 10px 22px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    transition: all 0.3s ease;
  }
  .result.hit {
    background: linear-gradient(90deg, #ff5e57, #ff9f43);
    border-color: transparent;
    transform: scale(1.05);
    box-shadow: 0 8px 24px rgba(255,94,87,0.4);
  }

  .tip { font-size: 13px; color: rgba(255,255,255,0.5); }

  /* 弹窗 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: linear-gradient(160deg, #2b2b4a, #1a1a2e);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 22px;
    padding: 36px 28px 28px;
    width: min(84vw, 360px);
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    transform: scale(0.7) translateY(20px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .overlay.show .modal { transform: scale(1) translateY(0); }

  .modal .label {
    font-size: 15px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 3px;
    margin-bottom: 6px;
  }
  .modal .big {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    margin: 6px 0 20px;
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .modal .big .emoji { font-size: 72px; line-height: 1.1; }
  .modal .big .name {
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.2;
    background: linear-gradient(90deg, #ffd54f, #ff9f43, #ff5e57);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal .btn-row { display: flex; gap: 12px; }
  .modal button {
    flex: 1;
    padding: 13px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    transition: transform 0.1s ease;
  }
  .modal button:active { transform: scale(0.95); }
  .modal .again { background: rgba(255,255,255,0.14); }
  .modal .ok { background: linear-gradient(90deg, #ff5e57, #ff9f43); }

  /* 静音按钮 */
  .mute {
    position: fixed;
    top: 16px; right: 16px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 200;
    transition: background 0.2s;
  }
  .mute:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <h1>今天吃什么<span class="emoji">🍜</span></h1>

  <div class="wheel-wrap">
    <canvas id="wheel" width="800" height="800"></canvas>
    <div class="pointer"></div>
    <button class="spin-btn" id="spinBtn">转</button>
  </div>

  <div class="result" id="result">点「转」看看命运的安排～</div>
  <div class="tip">共 35 种选择 · 点到即止</div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="label">今天吃</div>
      <div class="big">
        <span class="emoji" id="bigEmoji"></span>
        <span class="name" id="bigFood"></span>
      </div>
      <div class="btn-row">
        <button class="again" id="againBtn">再转一次</button>
        <button class="ok" id="okBtn">就吃这个！</button>
      </div>
    </div>
  </div>

  <button class="mute" id="muteBtn" title="静音">🔊</button>

<script>
  const items = [
    { name: "汉堡", emoji: "🍔" },
    { name: "炸鸡", emoji: "🍗" },
    { name: "拌面", emoji: "🍜" },
    { name: "螺蛳粉", emoji: "🐌" },
    { name: "鸭货", emoji: "🦆" },
    { name: "寿司", emoji: "🍣" },
    { name: "冒菜", emoji: "🌶️" },
    { name: "关东煮", emoji: "🍢" },
    { name: "烧烤", emoji: "🍖" },
    { name: "糖水", emoji: "🍧" },
    { name: "快餐", emoji: "🍟" },
    { name: "牛杂", emoji: "🐮" },
    { name: "奶茶", emoji: "🧋" },
    { name: "凉面", emoji: "🍜" },
    { name: "饺子", emoji: "🥟" },
    { name: "粥", emoji: "🥣" },
    { name: "云吞", emoji: "🥟" },
    { name: "披萨", emoji: "🍕" },
    { name: "手抓饼", emoji: "🫓" },
    { name: "麻辣烫", emoji: "🍲" },
    { name: "食堂", emoji: "🍽️" },
    { name: "手撕鸡", emoji: "🐔" },
    { name: "鱼", emoji: "🐟" },
    { name: "意面", emoji: "🍝" },
    { name: "泰餐", emoji: "🍛" },
    { name: "韩料", emoji: "🥘" },
    { name: "罐罐米线", emoji: "🍜" },
    { name: "牛肉面", emoji: "🍜" },
    { name: "砂锅粉", emoji: "🍲" },
    { name: "辣鸡粉", emoji: "🌶️" },
    { name: "车仔面", emoji: "🍜" },
    { name: "火锅鸡", emoji: "🍲" },
    { name: "菌菇炒饭", emoji: "🍄" },
    { name: "炒饭", emoji: "🍚" },
    { name: "烤鸭", emoji: "🦆" }
  ];

  // 色板：相邻段不同色即可
  const palette = [
    "#FF6B6B", "#4ECDC4", "#FFD93D", "#6C5CE7", "#FF8C42",
    "#45B7D1", "#FF6FB5", "#3CB371", "#F39C12", "#9B59B6",
    "#E74C3C", "#1ABC9C", "#F1C40F", "#3498DB", "#E67E22",
    "#2ECC71", "#FFA07A", "#8E44AD", "#FD79A8", "#00B894"
  ];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const btn = document.getElementById("spinBtn");
  const resultEl = document.getElementById("result");
  const overlay = document.getElementById("overlay");
  const bigFood = document.getElementById("bigFood");
  const bigEmoji = document.getElementById("bigEmoji");
  const againBtn = document.getElementById("againBtn");
  const okBtn = document.getElementById("okBtn");
  const muteBtn = document.getElementById("muteBtn");

  const N = items.length;
  const segment = (Math.PI * 2) / N;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const R = canvas.width / 2 - 6;          // 外半径
  const r = R * 0.24;                       // 内圈（中心按钮区域）

  // 绘制转盘（index 0 从正上方开始）
  function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < N; i++) {
      const start = -Math.PI / 2 + i * segment;
      const end = start + segment;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, start, end);
      ctx.closePath();
      ctx.fillStyle = palette[i % palette.length];
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // 外圈描边
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.lineWidth = 10;
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    // 文字（沿半径方向，向外）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let i = 0; i < N; i++) {
      const mid = -Math.PI / 2 + i * segment + segment / 2;
      ctx.save();
      ctx.rotate(mid);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 30px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.shadowColor = "rgba(0,0,0,0.45)";
      ctx.shadowBlur = 3;
      const textR = (r + R) / 2 + 8;
      ctx.fillText(items[i].name + " " + items[i].emoji, textR, 0);
      ctx.restore();
    }
    ctx.restore();

    // 内圈白环
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
  }

  let rotation = 0;      // 当前累计旋转角度（度）
  let spinning = false;
  let muted = false;

  function applyRotation() {
    canvas.style.transform = `rotate(${rotation}deg)`;
  }

  // ---------- 音效（Web Audio 实时合成，无需音频文件） ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  // 指针划过一格时的柔和“哒”声
  function tick() {
    if (muted) return;
    ensureAudio();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(650, t);
    osc.frequency.exponentialRampToValueAtTime(380, t + 0.04);
    gain.gain.setValueAtTime(0.05, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.08);
  }

  // 结果揭晓的上行小琶音
  function win() {
    if (muted) return;
    ensureAudio();
    const t = audioCtx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const st = t + i * 0.12;
      osc.type = "sine";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, st);
      gain.gain.exponentialRampToValueAtTime(0.2, st + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(st);
      osc.stop(st + 0.38);
    });
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    btn.disabled = true;
    resultEl.classList.remove("hit");
    resultEl.textContent = "转动中……";
    ensureAudio();

    // 随机多转几圈 + 随机落点
    const target = rotation + 360 * (6 + Math.random() * 4) + Math.random() * 360;
    const startRotation = rotation;
    const delta = target - startRotation;
    const duration = 4200 + Math.random() * 600;
    const startTime = performance.now();
    const segDeg = 360 / N;
    let lastIndex = -1;
    let lastTick = 0;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function frame(now) {
      const t = Math.min((now - startTime) / duration, 1);
      rotation = startRotation + delta * easeOutCubic(t);
      applyRotation();

      // 指针划过扇区边界时“哒”一声
      const norm = ((rotation % 360) + 360) % 360;
      const idx = Math.floor(((360 - norm) % 360) / segDeg);
      if (idx !== lastIndex) {
        lastIndex = idx;
        if (t < 1 && now - lastTick > 50) { lastTick = now; tick(); }
      }

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = target;
        spinning = false;
        btn.disabled = false;
        showResult();
      }
    }
    requestAnimationFrame(frame);
  }

  function showResult() {
    // 指针固定在正上方(12点)。轮盘转了 rotation 度，
    // 那么正上方对应的是轮盘上哪个角度？
    const norm = ((rotation % 360) + 360) % 360;
    // 轮盘上 0 号扇区起始于 -90°，指针角度换算成轮盘本地角度：
    const pointerLocal = (360 - norm) % 360;   // 度
    let idx = Math.floor(pointerLocal / (360 / N));
    idx = (idx + N) % N;
    const item = items[idx];
    resultEl.textContent = `就吃：${item.name} ${item.emoji}`;
    resultEl.classList.add("hit");
    bigEmoji.textContent = item.emoji;
    bigFood.textContent = item.name;
    overlay.classList.add("show");
    win();
  }

  function closeOverlay() { overlay.classList.remove("show"); }

  btn.addEventListener("click", spin);
  againBtn.addEventListener("click", () => { closeOverlay(); spin(); });
  okBtn.addEventListener("click", closeOverlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeOverlay(); });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  drawWheel();
  applyRotation();
</script>
</body>
</html>
